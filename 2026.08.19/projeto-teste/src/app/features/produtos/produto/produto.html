<mat-card class="produto-card">
  <mat-card-header>
    <h3>{{ nome | uppercase }}</h3>
  </mat-card-header>

  <mat-card-content>
    <p>Preço: {{ preco | precoBrlFormatado }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-stroked-button color="primary" (click)="selecionarProduto()">Selecionar</button>
    <button mat-flat-button color="accent" (click)="adicionarAoCarrinho()">
      Adicionar ao carrinho
    </button>
  </mat-card-actions>
</mat-card>
